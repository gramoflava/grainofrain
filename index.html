<!DOCTYPE html>
<html lang="en" data-accent="grainofrain">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Grain of Rain</title>
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (error) {}
      if (theme === 'light') document.documentElement.classList.add('theme-light');
      else if (theme === 'dark') document.documentElement.classList.add('theme-dark');
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./gramofdesign/gramof.css" />
  <link rel="stylesheet" href="./styles.css?v=3" />
  <script defer src="./gramofdesign/tools.js"></script>
  <script defer src="./gramofdesign/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="./js/ui.js?v=2"></script>
</head>
<body>
  <main class="container-fluid app">
    <header id="config-bar" class="appbar">
      <form id="controls" aria-label="Data configuration">
        
        <!-- Left: App Modes -->
        <div class="controls-left">
          <select id="mode-selector" aria-label="Analysis mode">
            <option value="comparison">Overview</option>
            <option value="periodic">Periodic</option>
            <option value="progression">Progression</option>
            <option value="rawdata">Raw Data</option>
          </select>
          <select id="smoothing-selector" aria-label="Smoothing">
            <option value="0">No smoothing</option>
            <option value="5">5 days</option>
            <option value="14">14 days</option>
          </select>
        </div>

        <!-- Center: Primary Parameters (The Search Pill) -->
        <div class="controls-center">
          
          <!-- Comparison Mode Controls -->
          <div id="controls-comparison" class="mode-controls">
            <div class="search-pill-group">
              <div class="city-tags-container">
                <div id="city-tags" class="city-tags"></div>
                <div class="city-input-wrapper">
                  <input id="city-search" class="city-search-input" type="search" name="search-location" placeholder="Add city..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false"/>
                  <button id="auto-location-btn" type="button" class="auto-location-btn" title="Auto-detect location">
                    <span class="icon-mask icon-mask--map-pin" aria-hidden="true"></span>
                  </button>
                  <div id="city-dropdown" class="city-dropdown" role="listbox"></div>
                </div>
              </div>
              <div class="pill-divider hide-md-flex"></div>
              <div class="date-row">
                <input id="start" type="date" />
                <span class="date-separator hide-md-flex">→</span>
                <input id="end" type="date" />
              </div>
            </div>
          </div>

          <!-- Periodic Mode Controls -->
          <div id="controls-periodic" class="mode-controls hidden">
            <div class="search-pill-group">
              <div class="city-tags-container">
                <div class="city-input-wrapper">
                  <input id="periodic-city-search" class="city-search-input" type="search" placeholder="City" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false"/>
                  <button id="auto-location-periodic-btn" type="button" class="auto-location-btn" title="Auto-detect location">
                    <span class="icon-mask icon-mask--map-pin" aria-hidden="true"></span>
                  </button>
                  <div id="periodic-city-dropdown" class="city-dropdown" role="listbox"></div>
                </div>
              </div>
              <div class="pill-divider hide-md-flex"></div>
              <div class="year-tags-container">
                <div id="year-tags" class="year-tags"></div>
                <input id="year-input" class="year-input" type="number" placeholder="Add year..." min="1940" max="2100"/>
              </div>
              <div class="pill-divider hide-md-flex"></div>
              <div class="date-row">
                <input id="period-start" type="text" placeholder="MM-DD start" pattern="\d{2}-\d{2}" />
                <span class="date-separator hide-md-flex">→</span>
                <input id="period-end" type="text" placeholder="MM-DD end" pattern="\d{2}-\d{2}" />
              </div>
            </div>
          </div>

          <!-- Progression Mode Controls -->
          <div id="controls-progression" class="mode-controls hidden">
            <div class="search-pill-group">
              <div class="city-tags-container">
                <div class="city-input-wrapper">
                  <input id="progression-city-search" class="city-search-input" type="search" placeholder="City" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false"/>
                  <button id="auto-location-progression-btn" type="button" class="auto-location-btn" title="Auto-detect location">
                    <span class="icon-mask icon-mask--map-pin" aria-hidden="true"></span>
                  </button>
                  <div id="progression-city-dropdown" class="city-dropdown" role="listbox"></div>
                </div>
              </div>
              <div class="pill-divider hide-md-flex"></div>
              <div class="period-selectors">
                <select id="period-type">
                  <option value="year">Year</option>
                  <option value="season">Season</option>
                  <option value="month">Month</option>
                  <option value="day">Specific day</option>
                </select>
                <div id="period-config-container">
                  <select id="season-select" style="display: none;">
                    <option value="winter">Winter</option>
                    <option value="spring">Spring</option>
                    <option value="summer">Summer</option>
                    <option value="fall">Fall</option>
                  </select>
                  <select id="month-select" style="display: none;">
                    <option value="1">January</option> <option value="2">February</option> <option value="3">March</option>
                    <option value="4">April</option> <option value="5">May</option> <option value="6">June</option>
                    <option value="7">July</option> <option value="8">August</option> <option value="9">September</option>
                    <option value="10">October</option> <option value="11">November</option> <option value="12">December</option>
                  </select>
                  <input id="day-select" type="text" placeholder="MM-DD" pattern="\d{2}-\d{2}" style="display: none;" />
                </div>
              </div>
              <div class="pill-divider hide-md-flex"></div>
              <div class="date-row">
                <input id="year-from" type="number" placeholder="From year" min="1940" max="2100" />
                <span class="date-separator hide-md-flex">→</span>
                <input id="year-to" type="number" placeholder="To year" min="1940" max="2100" />
              </div>
            </div>
          </div>

        </div>

        <!-- Right: Actions -->
        <div class="controls-right">
          <div class="btn-pair" aria-label="Chart export">
            <button id="copy" type="button" title="Copy charts" aria-label="Copy charts">
              <span class="icon-mask icon-mask--copy" aria-hidden="true"></span>
            </button>
            <button id="download" type="button" title="Download charts" aria-label="Download charts">
              <span class="icon-mask icon-mask--download" aria-hidden="true"></span>
            </button>
          </div>
          <button id="reset" type="button" class="btn btn--icon btn--danger icon-btn danger" title="Reset app" aria-label="Reset app">
            <span class="icon-mask icon-mask--reset" aria-hidden="true"></span>
          </button>
          <div class="site-tools" data-site-tools></div>
        </div>

      </form>
    </header>

    <div id="workspace" class="workspace">
      <div id="workspace-stub" class="workspace-stub hidden"></div>
      <div id="rdm-container" class="rdm-container hidden"></div>
      <section id="charts" class="stage" aria-label="Forecast charts">
        <div class="chart-card solid">
          <header class="chart-header-split">
            <span>Temperature</span>
            <div class="temp-focus-btns">
              <button class="tab-btn" data-focus="max">High</button>
              <button class="tab-btn active" data-focus="mean">Avg</button>
              <button class="tab-btn" data-focus="min">Low</button>
            </div>
          </header>
          <div id="chart-temp" class="chart" role="img" aria-label="Temperature chart"></div>
        </div>
        <div class="chart-card solid">
          <header class="chart-header-tabs">
            <button class="tab-btn active" data-tab="hydro">Humidity · Precip</button>
            <button class="tab-btn" data-tab="sun">Sunshine</button>
            <button class="tab-btn" data-tab="wind">Wind</button>
          </header>
          <div id="chart-hydro" class="chart" role="img" aria-label="Sub chart"></div>
        </div>
      </section>
      <aside id="panel" class="inspector">
        <section id="stats" class="stats" aria-live="polite"></section>
      </aside>
    </div>

  </main>

</body>
</html>
